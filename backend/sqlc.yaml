# Настройки генерации кода доступа к БД (sqlc).
# Схема берётся из миграций, запросы — из internal/repository/postgres/queries/<модуль>.sql,
# весь код генерируется в один пакет internal/repository/postgres/sqlc.
# После изменения запросов или миграций: go tool sqlc generate
version: "2"

sql:
  - engine: postgresql
    schema: migrations
    queries: internal/repository/postgres/queries
    gen:
      go:
        package: sqlc
        out: internal/repository/postgres/sqlc
        sql_package: pgx/v5
        omit_unused_structs: true
        emit_pointers_for_null_types: true # NULL в БД — nil в Go
        overrides:
          - db_type: timestamptz
            go_type: time.Time
        # Таблицы лежат в схемах модулей, и sqlc добавляет имя схемы к именам моделей
        # (AuthUser, MediaMediaFile). Возвращаем короткие имена.
        rename:
          auth_user: User
          catalog_category: Category
          media_media_file: MediaFile
          shop_order: Order
          shop_order_item: OrderItem
          shop_product: Product
