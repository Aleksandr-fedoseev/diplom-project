# Локальный запуск бэкенда вместе с PostgreSQL + PostGIS и MinIO.
#   docker compose up -d --build
# Значения берутся из файла .env (образец — .env.example).
# OSRM по умолчанию берётся публичный; свой контейнер — в профиле osrm (см. README).

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: heritage
      POSTGRES_USER: heritage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # 5433 снаружи, чтобы не конфликтовать с другими PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritage -d heritage"]
      interval: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio-data:/data
    ports:
      - "9002:9000"
      - "9003:9001" # веб-консоль MinIO: http://localhost:9003

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      DATABASE_URL: postgres://heritage:${POSTGRES_PASSWORD}@db:5432/heritage?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      OSRM_URL: ${OSRM_URL:-https://routing.openstreetmap.de/routed-foot}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Свой маршрутизатор. Включается так: docker compose --profile osrm up -d
  # и OSRM_URL=http://osrm:5000 в .env. Данные готовятся заранее (README, раздел OSRM).
  osrm:
    image: osrm/osrm-backend:v5.27.1
    profiles: ["osrm"]
    command: osrm-routed --algorithm mld /data/astrakhan.osrm
    volumes:
      - ./osrm-data:/data
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  pg-data:
  minio-data:
