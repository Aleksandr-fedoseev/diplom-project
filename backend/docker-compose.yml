# Локальный запуск бэкенда вместе с PostgreSQL + PostGIS и S3-хранилищем SeaweedFS.
#   docker compose up -d --build
# Значения берутся из файла .env (образец — .env.example).
# OSRM по умолчанию берётся публичный; свой контейнер — в профиле osrm (см. README).

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: heritage
      POSTGRES_USER: heritage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # 5433 снаружи, чтобы не конфликтовать с другими PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U heritage -d heritage"]
      interval: 5s
      retries: 10

  # S3-совместимое хранилище медиафайлов — SeaweedFS (режим mini: master, volume,
  # filer и S3-шлюз в одном контейнере). Заменило MinIO: образ minio/minio больше
  # не скачивается. Ключи доступа берутся из MINIO_ACCESS_KEY / MINIO_SECRET_KEY
  # (имена переменных остались от MINIO, менять их не нужно): при каждом старте
  # скрипт ниже записывает из них конфигурацию S3-пользователя.
  storage:
    image: chrislusf/seaweedfs:4.48
    environment:
      S3_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      S3_SECRET_KEY: ${MINIO_SECRET_KEY}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        cat > /tmp/s3.json <<EOF
        {"identities":[{"name":"heritage","credentials":[{"accessKey":"$${S3_ACCESS_KEY}","secretKey":"$${S3_SECRET_KEY}"}],"actions":["Admin","Read","Write","List","Tagging"]}]}
        EOF
        chmod 644 /tmp/s3.json
        exec /entrypoint.sh mini -dir=/data -ip=127.0.0.1 -ip.bind=0.0.0.0 \
          -s3.config=/tmp/s3.json -master.telemetry=false \
          -webdav=false -admin.ui=false -s3.port.iceberg=0 -s3.port.lance=0
    volumes:
      - storage-data:/data
    ports:
      - "9002:8333" # S3 API: http://localhost:9002
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 5s
      retries: 20

  backend:
    build: .
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://heritage:${POSTGRES_PASSWORD}@db:5432/heritage?sslmode=disable
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: storage:8333 # имена MINIO_* исторические, хранилище — SeaweedFS
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      OSRM_URL: ${OSRM_URL:-https://routing.openstreetmap.de/routed-foot}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Почта: без SMTP_HOST письма только пишутся в лог бэкенда.
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@localhost}
      # ЮKassa: без YOOKASSA_SHOP_ID заказы создаются, но без оплаты.
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      YOOKASSA_RETURN_URL: ${YOOKASSA_RETURN_URL:-http://localhost:3000/shop/orders}
    ports:
      - "8080:8080"
    restart: unless-stopped

  # Свой маршрутизатор. Включается так: docker compose --profile osrm up -d
  # и OSRM_URL=http://osrm:5000 в .env. Данные готовятся заранее (README, раздел OSRM).
  osrm:
    image: osrm/osrm-backend:v5.27.1
    profiles: ["osrm"]
    command: osrm-routed --algorithm mld /data/astrakhan.osrm
    volumes:
      - ./osrm-data:/data
    ports:
      - "5000:5000"
    restart: unless-stopped

volumes:
  pg-data:
  storage-data:
